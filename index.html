<!doctype html>
<html lang="en">

<link rel="stylesheet" href="main.css">

    <style>
        /* Global Body Font */
        body {
            font-family: 'Lato', sans-serif;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        /* Variation 1: Elegant Serif for the Main Story Title */
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        /* Variation 2: Handwritten Style for the Name */
        h2 {
            font-weight: 400;
            color: #000000;
            font-size: 2rem;
            margin-top: 0;
        }

        /* Button Styling */
        .html-button1 {
            display: inline-block;
            padding: 10px 16px;
            background-color: black;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.2s ease;
            font-weight: bold;
            margin-top: 20px;
        }

        .html-button1:hover {
            background-color: #333;
        }

        /* Utility for spacing */
        .spacer {
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <h2>Conrad Brousseau</h2>

    <div class="spacer"></div>

    <p>
        <strong>Core 1: Interactions</strong>
    </p>
    <p>
        September 2026
    </p>

    <div class="spacer"></div>

    <h1>
        Today I took a walk...
    </h1>

    <p>
        <a href="Page2.html" class="html-button1">
            Follow me along!
        </a>
    </p>

</body>
</html>
